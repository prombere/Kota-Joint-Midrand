<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>
    <nav>
        <div class="logo">Midrand Kota Joint</div>
        <button class="menu-toggle" aria-label="Open navigation menu">
            ☰
        </button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>


<section class="contact-page">

<h1>Place Your Order</h1>

<form id="orderForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<select id="kota">

<option>Aeroplane                R70</option>

<option>Helicopter               R65</option>

<option>Benz Special             R55</option>

<option>Benz                     R48</option>

<option>BMW                      R45</option>

<option>JR R40</option>
<option>JR jr R40</option>

<option>Tazz jr R35</option>
<option>Tazz R33</option>

</select>

<input
type="number"
id="quantity"
placeholder="Quantity"
required>

<button type="submit">

Send Order To WhatsApp

</button>

</form>

<div class="contact-promo">
<img src="images/midrand-kota-promo.jpeg" alt="Midrand Kota Joint promotion">
</div>

</section>

<footer>
<div class="footer-content">
<p>© 2026 Midrand Kota Joint</p>
<div class="footer-contact">
<p><strong>Address:</strong> 528 Market Street, Grand Central, Midrand</p>
<p><strong>WhatsApp:</strong> 076 525 2631</p>
<p><strong>Trading Hours:</strong> 10h00 - 19h30</p>
</div>
</div>
<div class="footer-logo"><img src="images/CodeN/code nucleus (normal blue).png" alt="Code Nucleus Logo"></div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
